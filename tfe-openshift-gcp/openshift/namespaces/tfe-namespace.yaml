# openshift/namespaces/tfe-namespace.yaml
---
apiVersion: v1
kind: Namespace
metadata:
  name: openshift-tfe
  labels:
    app.kubernetes.io/managed-by: tfe-deploy
    environment: production
  annotations:
    openshift.io/description: "Terraform Enterprise deployment namespace"
---
# Security Context Constraints binding — allow TFE to run as non-root
apiVersion: security.openshift.io/v1
kind: SecurityContextConstraints
metadata:
  name: tfe-scc
allowHostNetwork: false
allowHostPorts: false
allowHostPID: false
allowHostIPC: false
allowPrivilegeEscalation: false
allowPrivilegedContainer: false
runAsUser:
  type: MustRunAsNonRoot
seLinuxContext:
  type: MustRunAs
fsGroup:
  type: MustRunAs
  ranges:
    - min: 1000
      max: 65535
supplementalGroups:
  type: RunAsAny
volumes:
  - configMap
  - downwardAPI
  - emptyDir
  - persistentVolumeClaim
  - projected
  - secret
users:
  - system:serviceaccount:openshift-tfe:tfe
groups: []
---
# Role binding for TFE service account to use the SCC
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: tfe-scc-role
rules:
  - apiGroups: ["security.openshift.io"]
    resources: ["securitycontextconstraints"]
    resourceNames: ["tfe-scc"]
    verbs: ["use"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: tfe-scc-binding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: tfe-scc-role
subjects:
  - kind: ServiceAccount
    name: tfe
    namespace: openshift-tfe
---
# Kubernetes Service Account with Workload Identity annotation
apiVersion: v1
kind: ServiceAccount
metadata:
  name: tfe
  namespace: openshift-tfe
  annotations:
    iam.gke.io/gcp-service-account: "PLACEHOLDER_TFE_SA_EMAIL"
    # This annotation is patched by deploy-tfe.sh with the real SA email
