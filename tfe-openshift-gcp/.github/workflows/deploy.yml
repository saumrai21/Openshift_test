name: TFE Deploy Pipeline

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "*.md"
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        default: 'prod'
        type: choice
        options: [dev, prod]
      skip_infra:
        description: 'Skip infrastructure (Terraform) step'
        required: false
        default: false
        type: boolean

env:
  TF_VERSION: "1.7.4"
  GOOGLE_CREDENTIALS: ${{ secrets.GCP_SA_KEY }}

jobs:
  preflight:
    name: Preflight Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
      - name: Install oc + helm
        run: |
          curl -LO https://mirror.openshift.com/pub/openshift-v4/clients/ocp/stable/openshift-client-linux.tar.gz
          tar xzf openshift-client-linux.tar.gz && sudo mv oc /usr/local/bin/
          curl https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
      - name: Terraform format check
        run: terraform fmt -check -recursive terraform/
      - name: Helm lint
        run: helm lint helm/tfe-chart/

  plan:
    name: Terraform Plan
    runs-on: ubuntu-latest
    needs: preflight
    environment: ${{ github.event.inputs.environment || 'prod' }}
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
      - uses: google-github-actions/setup-gcloud@v2
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
      - name: Write tfvars
        run: |
          echo '${{ secrets.TF_VARS }}' > terraform/environments/${{ github.event.inputs.environment || 'prod' }}/terraform.tfvars
      - name: Terraform Init & Plan
        working-directory: terraform/environments/${{ github.event.inputs.environment || 'prod' }}
        run: |
          terraform init
          terraform plan -out=tfplan
      - uses: actions/upload-artifact@v4
        with:
          name: tfplan
          path: terraform/environments/${{ github.event.inputs.environment || 'prod' }}/tfplan

  deploy:
    name: Deploy TFE
    runs-on: ubuntu-latest
    needs: plan
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    environment:
      name: ${{ github.event.inputs.environment || 'prod' }}
      url: ${{ steps.get-url.outputs.url }}
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
      - uses: google-github-actions/setup-gcloud@v2
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
      - name: Install tools
        run: |
          curl -LO https://mirror.openshift.com/pub/openshift-v4/clients/ocp/stable/openshift-client-linux.tar.gz
          tar xzf openshift-client-linux.tar.gz && sudo mv oc /usr/local/bin/
          curl https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
          sudo apt-get install -y jq
      - name: Write secrets
        run: |
          echo '${{ secrets.TF_VARS }}' > terraform/environments/${{ github.event.inputs.environment || 'prod' }}/terraform.tfvars
          echo '${{ secrets.TFE_LICENSE }}' > terraform.hclic
      - name: Deploy
        run: |
          chmod +x scripts/*.sh
          ./scripts/deploy.sh \
            --env ${{ github.event.inputs.environment || 'prod' }} \
            ${{ github.event.inputs.skip_infra == 'true' && '--skip-infra' || '' }}
      - name: Get TFE URL
        id: get-url
        run: |
          HOST=$(grep 'tfe_hostname' terraform/environments/${{ github.event.inputs.environment || 'prod' }}/terraform.tfvars | awk -F'"' '{print $2}')
          echo "url=https://${HOST}" >> $GITHUB_OUTPUT
      - name: Upload deploy log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deploy-log
          path: deploy-*.log
